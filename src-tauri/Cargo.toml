[package]
name = "tweax"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"

[lib]
name = "tweax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" = permet d'ajouter plusieurs webviews dans une même fenêtre
tauri = { version = "2", features = ["unstable", "image-png"] }
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
csv = "1"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

[profile.dev.package.argon2]
opt-level = 3 # Argon2 est inutilisable en debug sinon (déverrouillage de plusieurs secondes)

# Mises à jour automatiques (desktop uniquement)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
